services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kronkeeper
      POSTGRES_PASSWORD: kronkeeper
      POSTGRES_DB: kronkeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronkeeper -d kronkeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  kronkeeper:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://kronkeeper:kronkeeper@postgres:5432/kronkeeper
      API_LISTEN_ADDR: 0.0.0.0:8080
      WORKER_COUNT: 10
      WORKER_QUEUE_SIZE: 1000
      HEAP_LOOKAHEAD_LIMIT: 10000
      LEASE_DURATION_SECS: 30
      LEASE_REAPER_INTERVAL_SECS: 10
      MAX_RETRY_BACKOFF_SECS: 3600
      WEBHOOK_TIMEOUT_SECS: 5
      WEBHOOK_MAX_RETRIES: 3
      SCRIPT_SAFE_DIR: /opt/daemon/scripts
      RUST_LOG: info
    volumes:
      - ./scripts:/opt/daemon/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
